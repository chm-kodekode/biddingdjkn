name: Auto Scraper Lelang.go.id

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Chromium & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 5. Jalankan Scraper
        run: |
          python scrapper-lelang.py

      - name: 6. Commit & Push Data ke Repositori
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hasil_lelang_mobil.csv data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update hasil lelang mobil" && git push)

      - name: 7. Upload CSV sebagai Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-lelang-mobil
          path: hasil_lelang_mobil.csv
          retention-days: 30
